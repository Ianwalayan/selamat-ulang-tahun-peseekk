<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selamat Ulang Tahun</title>
<style>
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; height:100%; width:100%;
    background:#0f0d0c;
    font-family: 'Segoe UI', sans-serif;
    overflow:hidden;
  }
  #stage{
    position:relative;
    width:100%; height:100dvh;
    display:flex; align-items:center; justify-content:center;
  }
  .slide{
    position:absolute;
    inset:0;
    display:flex; align-items:center; justify-content:center;
    opacity:0;
    transition: opacity .5s ease;
    pointer-events:none;
  }
  .slide.active{ opacity:1; pointer-events:auto; }
  .slide img{
    max-width: 92%;
    max-height: 88%;
    object-fit: contain;
    border-radius: 10px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  }
  .nav-arrow{
    position:absolute;
    top:50%; transform:translateY(-50%);
    width:48px; height:48px;
    border-radius:50%;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.3);
    color:#fff;
    font-size:22px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    z-index: 20;
  }
  .nav-arrow:hover{ background: rgba(255,255,255,0.22); }
  .nav-arrow.left{ left: 16px; }
  .nav-arrow.right{ right: 16px; }
  .nav-arrow[disabled]{ opacity:0.25; pointer-events:none; }

  .dots{
    position:absolute;
    bottom: 22px; left:50%; transform:translateX(-50%);
    display:flex; gap:8px;
    z-index:20;
  }
  .dot{
    width:8px; height:8px; border-radius:50%;
    background: rgba(255,255,255,0.3);
    cursor:pointer;
  }
  .dot.on{ background:#fff; transform:scale(1.3); }
</style>
</head>
<body>

<div id="stage">
  <button class="nav-arrow left" id="prevBtn">&#8592;</button>

  <div class="slide active"><img src="foto1.jpg" alt="slide 1"></div>
  <div class="slide"><img src="foto2.jpg" alt="slide 2"></div>
  <div class="slide"><img src="foto3.jpg" alt="slide 3"></div>
  <div class="slide"><img src="foto4.jpg" alt="slide 4"></div>
  <div class="slide"><img src="foto5.jpg" alt="slide 5"></div>
  <div class="slide"><img src="foto6.jpg" alt="slide 6"></div>

  <button class="nav-arrow right" id="nextBtn">&#8594;</button>
  <div class="dots" id="dots"></div>
</div>

<script>
  const slides = Array.from(document.querySelectorAll('.slide'));
  const dotsWrap = document.getElementById('dots');
  let current = 0;

  slides.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' on' : '');
    d.addEventListener('click', () => goTo(i));
    dotsWrap.appendChild(d);
  });
  const dots = Array.from(dotsWrap.children);

  function goTo(i){
    if(i < 0 || i >= slides.length) return;
    slides[current].classList.remove('active');
    dots[current].classList.remove('on');
    current = i;
    slides[current].classList.add('active');
    dots[current].classList.add('on');
    document.getElementById('prevBtn').disabled = current === 0;
    document.getElementById('nextBtn').disabled = current === slides.length - 1;
  }

  document.getElementById('prevBtn').addEventListener('click', () => goTo(current - 1));
  document.getElementById('nextBtn').addEventListener('click', () => goTo(current + 1));

  document.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowRight') goTo(current + 1);
    if(e.key === 'ArrowLeft') goTo(current - 1);
  });

  let touchX = null;
  document.addEventListener('touchstart', e => touchX = e.touches[0].clientX);
  document.addEventListener('touchend', e => {
    if(touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if(dx > 60) goTo(current - 1);
    if(dx < -60) goTo(current + 1);
    touchX = null;
  });

  goTo(0);
</script>

</body>
</html>
